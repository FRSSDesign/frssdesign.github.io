baseURL = 'https://frssdesign.github.io/'
languageCode = 'en-us'
title = 'Forensic-Ready System System Design'

[params]
  linkTitle = 'FRSS Design'
  themeVariant = 'frss-dark'
  math = true

[module]
  [[module.imports]]
    path = 'github.com/McShelby/hugo-theme-relearn'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]